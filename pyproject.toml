[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tangerine-photo-assistant"
version = "0.1.0"
description = "Local-first photo curation and Lightroom workflow assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Manamiiii" }]
dependencies = [
    "fastapi>=0.116,<1",
    "pillow>=11.3,<12",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "ruff>=0.12,<1",
]

[project.scripts]
tangerine-photo = "tangerine_photo_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tangerine_photo_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Blind `except Exception` guards are deliberate resilience boundaries in
# background workers, web endpoints, and long-running controller scripts.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Model-output validators intentionally raise ValueError; tests assert it.
"src/tangerine_photo_assistant/ai_analysis.py" = ["TRY004"]
"src/tangerine_photo_assistant/portable_data.py" = ["TRY004"]
"src/tangerine_photo_assistant/tags.py" = ["SIM118"]
"src/tangerine_photo_assistant/webapp.py" = ["I001"]
# Demo EXIF capture times are naive by design (EXIF stores no timezone).
"src/tangerine_photo_assistant/sample_data.py" = ["DTZ001"]
# Controller scripts log local wall-clock timestamps on purpose.
"scripts/*" = ["DTZ005"]
