[library]
# Example absolute Windows paths. Prefer the init command to generate your own.
# Browsing/analysis are read-only; explicit import/archive confirmation permits scoped copies/cleanup.
originals = "D:/Photos"
workspace = "D:/TangerinePhotoLibrary"
read_only = true

[cache]
# Disposable data only. The application must enforce this size ceiling.
root = "C:/TangerinePhotoCache"
max_size_gb = 20
# On-demand browser thumbnails get their own smaller budget inside the total ceiling.
thumbnail_max_size_gb = 4

[lightroom]
# Lightroom Classic catalog and previews benefit from NVMe storage.
catalog_root = ""
catalog_backup_root = ""
write_xmp = false

[analysis]
offline_only = true
pair_jpeg_raw = true
raw_extensions = [".raf", ".dng", ".cr2", ".cr3", ".nef", ".arw", ".rw2", ".orf"]
burst_time_gap_seconds = 3.0
generate_full_resolution_previews = false
metadata_batch_size = 32

[tools]
# Portable official build stored outside the source repository.
exiftool = ""

[models]
# Optional independent local model environment; leave blank for normal photo management.
python = ""
vision_language_model = ""
quantization = "none"
gpu_memory_limit_gb = 8
max_new_tokens = 512
image_max_edge = 960
json_retry_count = 1

[safety]
allow_move = false
allow_delete = false
allow_original_metadata_write = false
require_reviewed_manifest = true
