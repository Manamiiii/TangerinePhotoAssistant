name: Quality gates

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python and web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -c requirements-tested.txt -e ".[test]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Web tests
        run: npm test
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web

  windows-package:
    name: Windows x64 Setup and isolated lifecycle
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Isolated build environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -c requirements-tested.txt -c requirements-windows-build.txt -e ".[desktop,package]"
          npm ci --prefix web
      - name: Build unsigned Setup and Portable without publishing
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_app.ps1 -OutputDirectory runtime/packages/ci
      - name: Packaged backend and isolated installer lifecycle
        run: .venv/Scripts/python.exe scripts/check_windows_package.py --bundle runtime/packages/ci/dist/TangerinePhotoAssistant --report runtime/packages/ci/verification.json
      # No Release creation or binary upload. Native UI and clean-machine acceptance remain manual.
